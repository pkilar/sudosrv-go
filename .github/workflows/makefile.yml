name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# No job touches the GitHub API -- no gh pr, no github-script, no GITHUB_TOKEN --
# so read access to the repo contents is all any of them needs.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Without this the job runs on whatever Go the runner image ships, so the
    # go directive in go.mod forces a full toolchain download on every run and
    # nothing is cached. Matches the lint and govulncheck jobs.
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    # Only the protoc compiler comes from apt. The protoc-gen-go plugin is
    # pinned by the `tool` directive in go.mod and resolved by `make proto`
    # through `go tool`, so the apt package for it is unused — and is a
    # different version (1.32.0) from the protobuf runtime this module builds
    # against (v1.36.12). It was previously installing protobuf-compiler as a
    # transitive dependency, which is why that is now requested directly.
    # protoc is pinned to the version the committed .pb.go was generated with
    # (its header records `protoc v7.35.1`, i.e. protobuf release 35.1). The apt
    # package is 3.21.12, so `make proto` used to regenerate that file with a
    # different compiler than it was committed with -- a silent source of diff
    # noise and, in principle, of generated-code drift. Keep this in step with
    # the stamp in pkg/sudosrv_proto/sudo_logsrv.pb.go.
    - name: Install protoc
      env:
        PROTOC_VERSION: "35.1"
        # SHA-256 of protoc-35.1-linux-x86_64.zip. This is not optional: the apt
        # package this replaced was signature-verified by apt, so fetching a
        # release asset over plain HTTPS and executing it would be a step DOWN in
        # supply-chain terms. Verifying the digest pins the artefact so a
        # replaced or tampered asset fails the build instead of running as part
        # of it. Regenerate with:
        #   curl -fsSL <url> | sha256sum
        PROTOC_SHA256: "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7"
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/protoc.zip \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
        sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
        sudo chmod +x /usr/local/bin/protoc
        protoc --version

    - name: Resolve module dependencies
      run: make deps

    # The package recipes no longer regenerate this file; they consume the
    # committed one, because protoc is absent from every RHEL-family repository
    # and a build host's protoc is not the version the file was generated with.
    # That removed an accidental freshness check, so assert it here instead --
    # this job pins protoc to the version recorded in the file's header.
    - name: Committed protobuf is current
      run: |
        make proto
        git diff --exit-code -- pkg/sudosrv_proto/sudo_logsrv.pb.go

    - name: Build binary
      run: make build

    - name: Run tests
      run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    # Runs `make lint`, which pins the version in ONE place: GOLANGCI_LINT_VERSION
    # in the Makefile. This job previously used the golangci-lint action with its
    # own `version:`, so the same value lived in two files and could drift
    # silently -- bump the Makefile and CI would still pass on the old version,
    # which is exactly the "passes locally, differs in CI" gap the pin exists to
    # close. Invoking the Makefile target also means CI runs the command a
    # developer runs, not an equivalent one.
    - name: golangci-lint
      run: make lint

  # Builds each package format in a clean container and lints the BUILT package,
  # not the recipe. A recipe that parses proves very little: the three defects
  # this job was added for -- a logrotate config nothing depended on, a %post
  # naming the builder's own SOURCES directory, and a log directory logrotate
  # would have processed as root -- were all invisible until the artefact was
  # inspected, and all three would have shipped.
  #
  # Runs `make lint-packaging-<format>`, the same command a developer runs, for
  # the same reason the lint job invokes the Makefile rather than an equivalent.
  #
  # fail-fast is off so one format's failure still leaves the other two reported;
  # a broken RPM must not hide a broken .deb. Findings that genuinely do not
  # apply belong in that format's justified filter file
  # (packaging/rpm/sudosrv.rpmlintrc, packaging/debian/*.lintian-overrides),
  # each of which records WHY next to the entry -- never in a widened gate.
  packaging:
    runs-on: ubuntu-latest
    # Each format installs a toolchain and downloads the Go version go.mod asks
    # for, inside a container that starts empty every run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [rpm, deb, arch]
    steps:
    - uses: actions/checkout@v4

    # No setup-go: the build runs inside the container, on the toolchain that
    # format's distribution actually ships, which is the thing being tested.
    # The staging step uses `git archive HEAD`, so this lints the commit under
    # test -- on a pull request, the merge result.
    - name: Build and lint the ${{ matrix.format }} package
      run: make lint-packaging-${{ matrix.format }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-file: go.mod
