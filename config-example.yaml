server:
  mode: "local"
  listen_address: "0.0.0.0:30343"
#  listen_address_tls: "0.0.0.0:30344"
#  tls_cert_file: "server.crt" # Required if listen_address_tls is set
#  tls_key_file: "server.key"  # Required if listen_address_tls is set
  # idle_timeout: disabled by default, matching sudo_logsrvd, which never
  # disconnects an idle client. Leave it unset unless you truly need a deadline:
  # sudo treats a lost log connection as fatal to the COMMAND (its
  # ignore_iolog_errors defaults to false), so when this fires on an interactive
  # session the user's shell is killed, not just its log truncated.
  # idle_timeout: 30m
  # tls_check_peer: false       # true = require and verify a client certificate
  # tls_cacert_file: "ca.pem"   # CA bundle for client certs; empty = system trust store
  # server_timeout: 30s          # bounds writes to the client and the TLS
  #                              # handshake (NOT an idle deadline). 0 disables.
  server_operational_log_level: "debug"

# Settings for when server.mode is "local"
local_storage:
  log_directory: "/tmp/gosudo-io"

# Settings for when server.mode is "relay". server.mode is the only switch that
# turns relaying on: filling this block in while server.mode is "local" is now a
# startup error rather than a daemon that quietly stores everything locally.
#
# Relay mode is always store-and-forward: a session is journalled to
# relay_cache_directory and forwarded upstream after the client exits. There is
# no streaming mode, so the upstream never sees a session in progress.
#relay:
#  upstream_host: "127.0.0.1:30344"
#  require_upstream: false      # false (default): an unreachable upstream is
#                               # spooled locally and delivered later, so sudo
#                               # keeps working through an outage.
#                               # true: refuse the command when the upstream is
#                               # unreachable (fail closed on audit).
#  use_tls: false
#  tls_skip_verify: false       # false (default): the upstream certificate chain
#                               # AND hostname are verified on every dial. This is
#                               # stricter than sudo_logsrvd, which does not verify
#                               # its relay peer by default. For a private CA,
#                               # install it in the system trust store (or set
#                               # SSL_CERT_FILE) rather than setting this to true.
#  connect_timeout: 15s         # bounds the dial to the upstream only
#  response_timeout: 30s        # how long an already-connected upstream may take
#                               # to acknowledge a session. Too small a value
#                               # fails the flush of a slow upstream, and the
#                               # retry stores the session there a second time.
#  relay_cache_directory: "/tmp/sudosrv-cache"
#  reconnect_attempts: -1

# Optional read-only management HTTP API.
# Leave listen_address empty (or omit the entire api: block) to disable it.
#api:
#  listen_address: "127.0.0.1:30345"
#  auth_token_file: "/etc/sudosrv/api.token"  # preferred; file content is the bearer token
#  # auth_token: "raw-token-here"             # alternative; inline (discouraged for prod)
#  # tls_cert_file: "api.crt"                 # optional TLS for the API listener
#  # tls_key_file:  "api.key"
