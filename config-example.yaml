server:
  mode: "local"
  listen_address: "0.0.0.0:30343"
#  listen_address_tls: "0.0.0.0:30344"
#  tls_cert_file: "server.crt" # Required if listen_address_tls is set
#  tls_key_file: "server.key"  # Required if listen_address_tls is set
  # idle_timeout: disabled by default, matching sudo_logsrvd, which never
  # disconnects an idle client. Leave it unset unless you truly need a deadline:
  # sudo treats a lost log connection as fatal to the COMMAND (its
  # ignore_iolog_errors defaults to false), so when this fires on an interactive
  # session the user's shell is killed, not just its log truncated.
  # idle_timeout: 30m
  # server_timeout: 30s          # bounds writes to the client and the TLS
  #                              # handshake (NOT an idle deadline). 0 disables.
  server_operational_log_level: "debug"

# Settings for when server.mode is "local"
local_storage:
  log_directory: "/tmp/gosudo-io"

relay:
  upstream_host: "127.0.0.1:30344"
  use_tls: false
  connect_timeout: 15s
  relay_cache_directory: "/tmp/sudosrv-cache"
  reconnect_attempts: -1

# Optional read-only management HTTP API.
# Leave listen_address empty (or omit the entire api: block) to disable it.
#api:
#  listen_address: "127.0.0.1:30345"
#  auth_token_file: "/etc/sudosrv/api.token"  # preferred; file content is the bearer token
#  # auth_token: "raw-token-here"             # alternative; inline (discouraged for prod)
#  # tls_cert_file: "api.crt"                 # optional TLS for the API listener
#  # tls_key_file:  "api.key"
