# The sudosrv service account, created by systemd-sysusers on Debian and Arch.
# (The RPM creates the same account from %pre with useradd, because Fedora's
# sysusers macro is not available on every RPM distribution this targets.)
#
# The shell field is "-" deliberately, NOT a literal nologin path: nologin lives
# at /usr/sbin/nologin on Debian and /usr/bin/nologin on Arch, so a hardcoded
# path is wrong on one of them and leaves the account with a shell that does not
# exist. "-" makes systemd substitute the path its own distribution configured.
u sudosrv - "sudo I/O log server" /var/lib/sudosrv -
