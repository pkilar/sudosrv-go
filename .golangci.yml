version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forcetypeassert
    - gosec
    - intrange
    - modernize
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - (*sudosrv/internal/protocol.Processor).Close
    gosec:
      excludes:
        # G104 — covered by errcheck
        - G104
        # G115 — int→uint32/int32 conversions are length-prefix and timestamp
        # encodings bounded by upstream protocol/syscall semantics.
        - G115
        # G304 — three variable-path opens remain: the config file
        # (config/config.go), the relay cache file (relay/session.go, named from
        # a server-generated UUID), and the iolog sequence file
        # (storage/session.go). Per-session I/O is no longer among them — it
        # resolves through an os.Root pinned to the session directory, so the
        # path is never re-walked. The session path itself is still built from
        # sudoers escape sequences under explicit sanitisation
        # (containsDotDot, sanitizePathComponent).
        - G304
        # G302 — timing files are deliberately written 0440 (read-only after
        # session close) to match C sudo_logsrvd behaviour for sudoreplay.
        - G302
        # G402 — TLS InsecureSkipVerify is a config-controlled toggle for
        # operators testing relay against self-signed upstreams.
        - G402
        # G404 — math/rand/v2 is used only for jitter, never security.
        - G404
        # G204 — one site: logshell/exec.go execs the real shell, which is the
        # entire purpose of logsh. The path is never attacker-supplied: it comes
        # from the shells map in a root-owned, non-group-writable config file
        # (CheckPerms) and must survive ResolveShell's allowlist lookup before it
        # can be reached. The user-supplied argv is passed as arguments to execve,
        # not through a shell, so there is no interpretation step to inject into.
        - G204
    staticcheck:
      checks:
        - all
        # Protocol-event constants (IO_EVENT_*) intentionally match the
        # wire-protocol naming so a reader of the protobuf spec finds them
        # under the same identifiers.
        - -ST1003
        # Package/exported-symbol comment style is informally enforced by
        # convention here, not by the linter.
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        # QF1003 suggests tagged switches for two-clause string equality;
        # the explicit if/||/elseif chain is clearer for the I/O-stream
        # branching in storage/session.go and intentionally retained.
        - -QF1003
  exclusions:
    rules:
      # G103 — the ioctl wrappers in logsh's pty layer. Scoped to the one file
      # and the one rule rather than excluded globally, because unsafe appears
      # nowhere else in this tree and a repo-wide exclusion would stop flagging
      # it if it ever did.
      #
      # Every conversion here is unsafe.Pointer -> uintptr inside the
      # syscall.Syscall call expression, which is the single form the
      # unsafe.Pointer rules permit; anywhere else the GC could move the pointee
      # between the conversion and the call. The alternative is a dependency on
      # golang.org/x/sys, which this module deliberately does without —
      # syscall carries every constant needed on both architectures it ships.
      - path: internal/logshell/pty\.go
        text: "G103"
        linters:
          - gosec
      # G703 — the shell path in logsh's standalone recorder (-record), which
      # comes from the user's own -shell flag or their $SHELL. Scoped to the
      # one file and the one rule, for the same reason as G103 above.
      #
      # There is no privilege boundary here to traverse. Standalone recording
      # runs as the invoking user, records their own terminal and execs the
      # shell they named, all with privileges they already hold: someone who
      # could "traverse" to a binary could simply run it. That is what makes
      # this different from the LOGIN-shell path, where argv[0] is
      # attacker-influenced across a boundary and Config.Shells is the control
      # — an allowlist this path deliberately does not apply, since requiring
      # it would mean a standalone capture could not work without a system
      # configuration file.
      - path: cmd/logsh/main\.go
        text: "G703"
        linters:
          - gosec
      - path: pkg/sudosrv_proto/
        linters:
          - errcheck
          - gosec
          - govet
          - ineffassign
          - modernize
          - staticcheck
          - unused
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - bodyclose

# golangci-lint v2 moved formatters out of `linters:` into this top-level
# section; without it `make lint` and CI silently accept unformatted code.
# goimports runs without local-prefixes on purpose — this tree keeps stdlib and
# module imports in one block, and grouping "sudosrv/..." separately would
# rewrite the import block of nearly every file for no correctness gain.
formatters:
  enable:
    - gofmt
    - goimports
